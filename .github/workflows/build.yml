name: Build Live TV Categories v6 + Modern Filtered Guide

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_TAG: v0.6.0.0
  UPSTREAM_COMMIT: 8792acda4e02adfbd8ec7cbffd6d506d1c2200ca
  JELLYFIN_WEB_COMMIT: 61b1f890365ad15138e943e694af723c1d47df2a
  PLUGIN_VERSION: 0.6.0.1
  RELEASE_TAG: v0.6.0.1-jf12.2-filtered-guide
  PACKAGE_NAME: Jellyfin.Plugin.LiveTvCategories_0.6.0.1.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this custom builder repository
        uses: actions/checkout@v4

      - name: Get upstream Live TV Categories v0.6.0.0
        uses: actions/checkout@v4
        with:
          repository: JeKaQM/jellyfin-live-tv-category-browser
          ref: 8792acda4e02adfbd8ec7cbffd6d506d1c2200ca
          path: source

      - name: Get exact Jellyfin Web 12.2 source required by upstream v6
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-web
          ref: 61b1f890365ad15138e943e694af723c1d47df2a
          path: jellyfin-web

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify pinned source commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test "$(git -C jellyfin-web rev-parse HEAD)" = "$JELLYFIN_WEB_COMMIT"
          echo "Upstream plugin: $UPSTREAM_COMMIT"
          echo "Jellyfin Web:     $JELLYFIN_WEB_COMMIT"

      - name: Set custom plugin version
        run: python3 scripts/set_custom_version.py source "$PLUGIN_VERSION"

      - name: Apply upstream v6 Jellyfin Web integration
        shell: bash
        run: |
          set -euo pipefail
          JELLYFIN_WEB_SOURCE="$GITHUB_WORKSPACE/jellyfin-web" \
            bash source/scripts/prepare-jellyfin-web.sh

      - name: Generate custom category-group mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_category_groups.py \
            config/category-groups.json \
            jellyfin-web/src/apps/modern/features/libraries/utils/liveTvCategoryGroups.generated.ts

      - name: Add custom grouped browser and filtered Guide files
        shell: bash
        run: |
          set -euo pipefail

          install -m 0644 \
            overlay/src/apps/modern/features/libraries/components/LiveTvCategoryBrowser.tsx \
            jellyfin-web/src/apps/modern/features/libraries/components/LiveTvCategoryBrowser.tsx

          install -m 0644 \
            overlay/src/apps/modern/features/libraries/components/liveTvCategoryBrowser.scss \
            jellyfin-web/src/apps/modern/features/libraries/components/liveTvCategoryBrowser.scss

          install -m 0644 \
            overlay/src/apps/modern/features/libraries/components/GuideView.tsx \
            jellyfin-web/src/apps/modern/features/libraries/components/GuideView.tsx

          install -m 0644 \
            overlay/src/apps/modern/features/libraries/hooks/api/useLiveTvCategoryGuideChannels.ts \
            jellyfin-web/src/apps/modern/features/libraries/hooks/api/useLiveTvCategoryGuideChannels.ts

          install -m 0644 \
            overlay/src/apps/modern/features/libraries/utils/liveTvCategoryLabel.ts \
            jellyfin-web/src/apps/modern/features/libraries/utils/liveTvCategoryLabel.ts

          install -m 0644 \
            overlay/src/components/guide/category-modern.scss \
            jellyfin-web/src/components/guide/category-modern.scss

      - name: Apply custom Programmes hierarchy to upstream v6
        run: python3 scripts/patch_programmes_v6.py jellyfin-web

      - name: Apply category-filtered native Guide support
        run: python3 scripts/patch_guide.py jellyfin-web

      - name: Apply modern Guide styling and tooltip behaviour
        run: python3 scripts/patch_guide_modern.py jellyfin-web

      - name: Verify custom v6 Web assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_category_labels.py jellyfin-web
          python3 scripts/verify_v6_customizations.py jellyfin-web

      - name: Build Jellyfin Web 12.2
        working-directory: jellyfin-web
        run: |
          npm ci
          npm run build:production

      - name: Build and test upstream v6 server plugin
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/plugin" \
            bash source/scripts/build-plugin.sh

      - name: Package using upstream v6 catalog builder
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_RELEASE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
          PLUGIN_SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}" \
          PLUGIN_DLL_PATH="$GITHUB_WORKSPACE/artifacts/plugin/Jellyfin.Plugin.LiveTvCategories.dll" \
          JELLYFIN_WEB_DIST="$GITHUB_WORKSPACE/jellyfin-web/dist" \
          CATEGORY_BROWSER_DIST="$GITHUB_WORKSPACE/artifacts/plugin/category-browser" \
          CATALOG_OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/catalog" \
            bash source/scripts/build-catalog.sh

      - name: Apply custom manifest description
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/catalog/manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          plugin = manifest[0]
          plugin['overview'] = 'Grouped Live TV browsing plus a category-filtered Jellyfin Guide'
          plugin['description'] = (
              'Based on upstream Live TV Categories v0.6.0.0, retaining its backend, '
              'compatibility adapter, standalone browser and Jellyfin 12.2 integration. '
              'Adds editable parent category accordions, cleaned display labels and a '
              'category-filtered native EPG Guide.'
          )
          plugin['owner'] = 'jeno / swillis2031 custom filtered-guide build'
          plugin['versions'][0]['changelog'] = (
              'Rebased custom build on upstream v0.6.0.0. Preserves upstream v6 core mechanics '
              'and adds editable parent category groups, hidden numeric display prefixes, '
              'grouped Programmes browsing and the category-filtered modern Guide.'
          )
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload Actions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Categories-v6-Filtered-Guide
          path: |
            artifacts/catalog/${{ env.PACKAGE_NAME }}
            artifacts/catalog/manifest.json
            upstream.lock.json

      - name: Publish/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Live TV Categories 0.6.0.1 - Upstream v6 + Filtered Guide
          body: |
            Custom build based directly on JeKaQM Live TV Categories v0.6.0.0.

            Upstream v6 retained:
            - v6 backend/category discovery and compatibility adapter
            - Jellyfin 12.0/12.1/12.2 server compatibility model
            - official v6 Jellyfin Web 12.2 integration
            - independent /LiveTvCategories/ui/ browser
            - upstream permission, source-failure and category API handling

            Custom additions retained:
            - editable hierarchy in config/category-groups.json
            - top-level category accordions in Programmes and Guide
            - unmapped categories under Uncategorised
            - numeric prefixes retained for matching but hidden from display labels
            - category-filtered native Jellyfin EPG Guide
            - back-to-categories Guide control
            - modern rounded EPG styling and clearer logos
            - programme title/description/time tooltip on hover or keyboard focus

            Upstream base: v0.6.0.0 (8792acda4e02adfbd8ec7cbffd6d506d1c2200ca)
            Jellyfin Web base: v12.2 exact commit 61b1f890365ad15138e943e694af723c1d47df2a
          make_latest: true
          files: |
            artifacts/catalog/${{ env.PACKAGE_NAME }}
            artifacts/catalog/manifest.json
            upstream.lock.json
