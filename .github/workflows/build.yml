name: Build Live TV Categories 12.2 + Modern Filtered Guide

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_VERSION: 0.4.2.3
  JELLYFIN_ABI: 12.2.0.0
  RELEASE_TAG: v0.4.2.3-jf12.2-row-geometry-fix
  PACKAGE_NAME: Jellyfin.Plugin.LiveTvCategories_0.4.2.3.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this builder repository
        uses: actions/checkout@v4

      - name: Get upstream Live TV Categories source
        uses: actions/checkout@v4
        with:
          repository: JeKaQM/jellyfin-live-tv-category-browser
          ref: main
          path: source

      - name: Get Jellyfin Web 12.2
        uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-web
          ref: v12.2
          path: jellyfin-web

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Patch server plugin for Jellyfin 12.2
        run: python3 scripts/patch_plugin.py source

      - name: Verify 12.2 Web files touched by the upstream 12.1 overlay
        shell: bash
        run: |
          set -euo pipefail

          check_hash() {
            file="$1"
            expected="$2"
            actual="$(git -C jellyfin-web hash-object "$file")"
            echo "$file"
            echo "  expected: $expected"
            echo "  actual:   $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Jellyfin Web 12.2 changed a file that the upstream 12.1 overlay replaces."
              echo "::error::Stopping safely. Send this failed step back to ChatGPT so the overlay can be ported properly."
              exit 1
            fi
          }

          check_hash "src/apps/legacy/controllers/livetv/livetvsuggested.js" "49699fd4f2588f0be26f5f421e3ee44bddaf6f09"
          check_hash "src/apps/legacy/controllers/livetv.html" "365c5b4415c55f50eccab101bfd483390ab90eab"
          check_hash "src/apps/modern/features/libraries/components/PageTabContent.tsx" "430e09f6737f18ed1c06210a18cf62d556717922"

      - name: Apply upstream category-browser Web overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -a source/web/patches/jellyfin-web-12.1/. jellyfin-web/

      - name: Add category-filtered Guide extension
        shell: bash
        run: |
          set -euo pipefail
          cp -a overlay/. jellyfin-web/
          python3 scripts/patch_guide.py jellyfin-web
          python3 scripts/patch_guide_modern.py jellyfin-web

      - name: Build Jellyfin Web 12.2
        working-directory: jellyfin-web
        run: |
          npm ci
          npm run build:production

      - name: Build server plugin against Jellyfin 12.2
        run: |
          dotnet publish \
            source/Jellyfin.Plugin.LiveTvCategories/Jellyfin.Plugin.LiveTvCategories.csproj \
            --configuration Release \
            --no-self-contained \
            --output artifacts/plugin

      - name: Package plugin ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          stage = Path('artifacts/stage')
          package = Path('artifacts') / 'Jellyfin.Plugin.LiveTvCategories_0.4.2.3.zip'
          if stage.exists():
              shutil.rmtree(stage)
          (stage / 'web').mkdir(parents=True)

          shutil.copy2(
              'artifacts/plugin/Jellyfin.Plugin.LiveTvCategories.dll',
              stage / 'Jellyfin.Plugin.LiveTvCategories.dll'
          )
          shutil.copy2('source/LICENSE', stage / 'LICENSE')
          shutil.copy2('source/NOTICE.md', stage / 'NOTICE.md')

          web_dist = Path('jellyfin-web/dist')
          if not (web_dist / 'index.html').exists():
              raise SystemExit('Jellyfin Web build is missing dist/index.html')
          shutil.copytree(web_dist, stage / 'web', dirs_exist_ok=True)

          (stage / 'SOURCE.txt').write_text(
              'UNOFFICIAL TEMPORARY JELLYFIN 12.2 + FILTERED GUIDE BUILD\n'
              '==========================================================\n\n'
              'Plugin source: https://github.com/JeKaQM/jellyfin-live-tv-category-browser\n'
              'Jellyfin Web source: https://github.com/jellyfin/jellyfin-web/tree/v12.2\n\n'
              'Changes:\n'
              '- server plugin rebuilt against Jellyfin 12.2\n'
              '- bundled-Web exact-version guard changed to 12.2\n'
              '- upstream category-first Programmes view retained\n'
              '- category-first Guide picker added\n'
              '- selected category channels feed Jellyfin native Guide\n- modern rounded EPG styling, clearer logos and hover/focus motion\n- programme title/description/time tooltip on hover or keyboard focus\n',
              encoding='utf-8'
          )

          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(stage.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(stage).as_posix())

          print(package)
          PY

      - name: Create Jellyfin repository manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          package_name = os.environ['PACKAGE_NAME']
          package = Path('artifacts') / package_name
          checksum = hashlib.md5(package.read_bytes()).hexdigest().upper()
          source_url = f'https://github.com/{repo}/releases/download/{tag}/{package_name}'

          manifest = [{
              'guid': 'a4b2fdc8-cb2a-463b-812a-16e9ea88e12a',
              'name': 'Live TV Categories',
              'overview': 'Category-first Live TV browsing plus a modern category-filtered EPG Guide',
              'description': 'Unofficial Jellyfin 12.2 build with a category-first Guide, modern rounded EPG styling, larger channel logos and programme hover tooltips.',
              'owner': 'jeno / temporary filtered-guide build',
              'category': 'Live TV',
              'versions': [{
                  'version': os.environ['PLUGIN_VERSION'],
                  'changelog': 'Adds modern rounded EPG styling, clearer channel logos, hover/focus animation and programme description/time tooltips to the category-filtered native Jellyfin Guide.',
                  'targetAbi': os.environ['JELLYFIN_ABI'],
                  'sourceUrl': source_url,
                  'checksum': checksum,
                  'timestamp': datetime.now(timezone.utc).replace(microsecond=0).isoformat()
              }]
          }]

          Path('artifacts/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print('MD5:', checksum)
          print('sourceUrl:', source_url)
          PY

      - name: Upload Actions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Categories-12.2-Filtered-Guide
          path: |
            artifacts/Jellyfin.Plugin.LiveTvCategories_0.4.2.3.zip
            artifacts/manifest.json

      - name: Publish/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Live TV Categories 0.4.2.3 - JF 12.2 Modern Filtered Guide
          body: |
            UNOFFICIAL temporary compatibility/custom build.

            Based on JeKaQM Live TV Categories 0.4.0.0.
            Rebuilt against Jellyfin Server 12.2 and Jellyfin Web 12.2.

            Added:
            - category-first landing screen on Live TV -> Guide
            - filtered native EPG grid for the selected M3U group-title
            - back-to-categories button in the native Guide header
            - rounded modern programme cards and channel rows
            - larger/clearer channel logos
            - subtle hover/focus lift animation
            - programme description + time tooltip on hover/focus
            - fixed channel/programme row alignment
            - improved channel-logo contrast
          make_latest: true
          files: |
            artifacts/Jellyfin.Plugin.LiveTvCategories_0.4.2.3.zip
            artifacts/manifest.json
